# CodeMender PR gate (GitHub Actions). All scanning is performed by Google
# CodeMender (cm) inside the cm-orchestrator image.
#
# Repository variables (Settings → Variables), from Terraform output github_actions_variables:
#   CODEMENDER_WIF_PROVIDER, CODEMENDER_GATE_SA, CODEMENDER_AOR_BUCKET,
#   CODEMENDER_ORCHESTRATOR_IMAGE, CODEMENDER_REGISTRY_HOST
#
# Pin third-party actions to full commit SHAs in production (e.g. via Dependabot).
name: codemender-gate

on:
  pull_request:
    # Templated by scripts/deploy.sh to "[ <trunk>, <integration> ]" (e.g. [ main, develop ])
    # so both promotion PRs into trunk and feature PRs into the integration branch are gated.
    branches: [ main, develop ] # codemender:gate-branches
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: codemender-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # Fork PRs cannot mint OIDC tokens; they must be re-pushed to an in-repo branch.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_LOGIN: ${{ github.event.pull_request.user.login || github.actor }}
      REPOSITORY: ${{ github.repository }}
      IMAGE: ${{ vars.CODEMENDER_ORCHESTRATOR_IMAGE }}
      AOR_BUCKET: ${{ vars.CODEMENDER_AOR_BUCKET }}
      REGISTRY_HOST: ${{ vars.CODEMENDER_REGISTRY_HOST }}
      FIRESTORE_PROJECT: ${{ vars.CODEMENDER_FIRESTORE_PROJECT }}
      FIRESTORE_DB: ${{ vars.CODEMENDER_FIRESTORE_DB }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Collect PR author identities (separation of duties)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "${PR_NUMBER}" ]; then
            authors="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/commits" --paginate \
              --jq '.[] | (.author.login // empty), (.commit.author.email // empty)' | sort -u | paste -sd, -)"
            echo "PR_AUTHORS=${PR_LOGIN},${authors}" >> "${GITHUB_ENV}"
          else
            echo "PR_AUTHORS=${PR_LOGIN}" >> "${GITHUB_ENV}"
          fi

      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@6fc4af4b145ae7821d527454aa9bd537d1f2dc5f # v2.1.7
        with:
          workload_identity_provider: ${{ vars.CODEMENDER_WIF_PROVIDER }}
          service_account: ${{ vars.CODEMENDER_GATE_SA }}
          token_format: access_token

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@6189d56e4096ee891640bb02ac264be376592d6a # v2.1.2

      - name: Fetch Acceptance of Risk records (WORM bucket)
        run: |
          set -euo pipefail
          mkdir -p .build/aor
          gcloud storage cp "gs://${AOR_BUCKET}/aor/${REPOSITORY}/*.json" .build/aor/ 2>/dev/null \
            || echo "no AOR records for ${REPOSITORY}"
          gcloud auth configure-docker "${REGISTRY_HOST}" --quiet

      - name: Run CodeMender gate
        id: gate
        env:
          CREDS: ${{ steps.auth.outputs.credentials_file_path }}
          GCP_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set +e
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/home \
            -e GOOGLE_APPLICATION_CREDENTIALS=/run/creds.json \
            -e GOOGLE_CLOUD_PROJECT="${FIRESTORE_PROJECT}" \
            -e GCP_ACCESS_TOKEN \
            -v "${CREDS}:/run/creds.json:ro" \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            "${IMAGE}" \
            --mode=gate-pr \
            --base-ref="origin/${BASE_REF}" --head-ref=HEAD \
            --repository="${REPOSITORY}" \
            --firestore-project="${FIRESTORE_PROJECT}" \
            --firestore-db="${FIRESTORE_DB}" \
            --pr-authors="${PR_AUTHORS}" \
            --aor-dir=/workspace/.build/aor \
            --report-out=/workspace/.build/codemender-report.json \
            --patch-dir=/workspace/.build/codemender-patches
          echo "rc=$?" >> "${GITHUB_OUTPUT}"

      - name: Upload report and cm patches
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codemender-${{ github.event.pull_request.number }}
          path: |
            .build/codemender-report.json
            .build/codemender-patches/
          if-no-files-found: ignore
          retention-days: 30

      - name: Comment results on PR
        if: always() && github.event_name == 'pull_request' && hashFiles('.build/codemender-report.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "### 🛡️ CodeMender gate — $(jq -r '.rollout_phase' .build/codemender-report.json) phase"
            echo
            echo "Model \`$(jq -r '.model' .build/codemender-report.json)\` · files scanned: $(jq '.scanned_files|length' .build/codemender-report.json) · **blocking: $(jq '.blocked' .build/codemender-report.json)**"
            echo
            if [ "$(jq '.results|length' .build/codemender-report.json)" -gt 0 ]; then
              echo "| Decision | Severity | CWE | Location | Fingerprint | Reason |"
              echo "|---|---|---|---|---|---|"
              jq -r '.results[] | "| \(.outcome.decision) | \(.severity) | \(.cwe // "") | `\(.file):\(.line // 0)` | `\(.fingerprint)` | \(.outcome.reason | gsub("\\|"; "/")) |"' .build/codemender-report.json
              echo
              echo "Suggested cm patches are attached to the workflow run artifacts."
              echo "A Security Champion (not a PR author) may accept a finding with:"
              echo '`/aor-approve <fingerprint> <days> <justification>`'
            else
              echo "No first-party findings in changed files. ✅"
            fi
          } > .build/comment.md
          gh pr comment "${PR_NUMBER}" --repo "${REPOSITORY}" --body-file .build/comment.md --edit-last --create-if-none \
            || gh pr comment "${PR_NUMBER}" --repo "${REPOSITORY}" --body-file .build/comment.md

      - name: Enforce gate result
        env:
          RC: ${{ steps.gate.outputs.rc }}
        run: |
          case "${RC}" in
            0) echo "CodeMender gate passed." ;;
            1) echo "::error::CodeMender gate blocked net-new high-risk findings."; exit 1 ;;
            *) echo "::error::CodeMender gate errored (rc=${RC})."; exit 2 ;;
          esac
