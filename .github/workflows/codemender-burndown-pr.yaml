# Opens a pull request for each legacy remediation branch pushed by the
# CodeMender burn-down Cloud Run job (codemender/fix-<fingerprint12>).
name: codemender-burndown-pr

on:
  push:
    branches:
      - "codemender/fix-*"

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Open PR if missing
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          # Fix PRs land on the integration branch and are promoted to trunk through gated PRs.
          BASE: ${{ vars.CODEMENDER_DEV_BRANCH || github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          open="$(gh pr list --repo "${REPOSITORY}" --head "${BRANCH}" --state open --json number --jq 'length')"
          if [ "${open}" != "0" ]; then echo "PR already open for ${BRANCH}"; exit 0; fi
          git log -1 --format=%B > body.md
          {
            echo
            echo "---"
            echo "Automated legacy burn-down generated and verified by **Google CodeMender (cm)**."
            echo "Merging this PR transitions the finding to \`REMEDIATED\` in the Cloud Firestore baseline on the next seed run."
          } >> body.md
          gh pr create --repo "${REPOSITORY}" --base "${BASE}" --head "${BRANCH}" \
            --title "$(git log -1 --format=%s)" --body-file body.md
