# .codemender/config.yaml
# Official Google Cloud CodeMender (cm) CLI & Sandbox Configuration
# Reference: https://docs.cloud.google.com/gemini-enterprise-agent-platform/agents/codemender/set-up-environment

# Configurable Gemini model (default: gemini-3.8-flash; use gemini-4-argon for deep reasoning)
model: "gemini-3.8-flash"

# Interactive workstation confirmations (bypassed in hooks/CI via --yes --bypass-warning)
human_confirmation: true
confirm_writes: true

vcs:
  type: "git"

# Project build command executed inside CodeMender's exebox sandbox during `cm fix`
build:
  command: "npm run build:server"

scan:
  extensions:
    include:
      - ".ts"
      - ".tsx"
      - ".js"
      - ".jsx"
      - ".mjs"
      - ".cjs"
      - ".json"
      - ".yaml"
      - ".yml"
  exclude_dirs:
    - "node_modules"
    - "frontend/node_modules"
    - "build"
    - "dist"
    - "coverage"
    - ".git"
    - ".codemender"

sandbox:
  enabled: true
  mounts:
    target_dir: "."
  network:
    # Complete outbound network isolation inside the OS-level sandbox (exebox)
    profile: "permissive-closed"

security:
  protected_files:
    - "~/.ssh/*"
    - "~/.gitconfig"
    - ".env*"
